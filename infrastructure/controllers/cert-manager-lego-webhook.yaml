---
apiVersion: v1
kind: Namespace
metadata:
  name: tooling
  labels:
    toolkit.fluxcd.io/tenant: sre-team
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cert-manager-lego-webhook
  namespace: tooling
spec:
  interval: 12h
  url: https://yxwuxuanl.github.io/cert-manager-lego-webhook
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-lego-webhook
  namespace: tooling
spec:
  interval: 12h
  chart:
    spec:
      chart: cert-manager-lego-webhook 
      version: "1.6.2"
      sourceRef:
        kind: HelmRepository
        name: cert-manager-lego-webhook
  install:
    strategy:
      name: RetryOnFailure
    crds: CreateReplace
  upgrade:
    strategy:
      name: RetryOnFailure
    crds: CreateReplace
  values:
    certManager:
      namespace: cert-manager
      serviceAccount:
        name: cert-manager
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: dode
  namespace: tooling
spec:
  acme:
    email: sjhesse@gmail.com
    privateKeySecretRef:
      name: dode-issuer
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
    - dns01:
        webhook:
          groupName: lego.dns-solver
          solverName: lego-solver
          config:
            provider: dode
            envFrom:
              secret:
                name: dode-secret
