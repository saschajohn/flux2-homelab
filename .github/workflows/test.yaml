name: test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@f7e172882c35566ff6981d0907d2b6ad766a039f # main
      - name: Setup Flux Schema CLI
        uses: fluxcd/flux-schema/actions/setup@8b0f7cdf64233a551d46124d4b86f5b28912b09c # main
      - name: Validate manifests
        uses: fluxcd/flux-schema/actions/validate@8b0f7cdf64233a551d46124d4b86f5b28912b09c # main
        with:
          path: '.'
          config: '.fluxschema.yml'
      - name: Validate API versions
        run: |
          flux migrate -f . --yes
          if [[ $(git diff --stat) != '' ]]; then
            git --no-pager diff
            echo 'deprecated API versions found, run flux migrate and commit changes'
            exit 1
          fi
