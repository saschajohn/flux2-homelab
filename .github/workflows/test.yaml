name: test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@22c6ee1a6099ce252b729199c105a38319b587d4 # main
      - name: Setup Flux Schema CLI
        uses: fluxcd/flux-schema/actions/setup@e0c1965b73a3743ac7924c68779336589f53e94d # main
      - name: Validate manifests
        uses: fluxcd/flux-schema/actions/validate@e0c1965b73a3743ac7924c68779336589f53e94d # main
        with:
          path: '.'
          config: '.fluxschema.yml'
      - name: Validate API versions
        run: |
          flux migrate -f . --yes
          if [[ $(git diff --stat) != '' ]]; then
            git --no-pager diff
            echo 'deprecated API versions found, run flux migrate and commit changes'
            exit 1
          fi
