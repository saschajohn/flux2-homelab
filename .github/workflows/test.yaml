name: test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@bbaaff69c53a0c3422eef80a7612e8e9486ba3df # main
      - name: Setup Flux Schema CLI
        uses: fluxcd/flux-schema/actions/setup@8b80d2307627719ddf91597114b07fda9ae43d74 # main
      - name: Validate manifests
        uses: fluxcd/flux-schema/actions/validate@8b80d2307627719ddf91597114b07fda9ae43d74 # main
        with:
          path: '.'
          config: '.fluxschema.yml'
      - name: Validate API versions
        run: |
          flux migrate -f . --yes
          if [[ $(git diff --stat) != '' ]]; then
            git --no-pager diff
            echo 'deprecated API versions found, run flux migrate and commit changes'
            exit 1
          fi
