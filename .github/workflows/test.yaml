name: test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@5165b8434c39c4a59c958e3c21616d1c5fbcd161 # main
      - name: Setup Flux Schema CLI
        uses: fluxcd/flux-schema/actions/setup@5a0846e4358013c06804d249d659cbf3fae59292 # main
      - name: Validate manifests
        uses: fluxcd/flux-schema/actions/validate@5a0846e4358013c06804d249d659cbf3fae59292 # main
        with:
          path: '.'
          config: '.fluxschema.yml'
      - name: Validate API versions
        run: |
          flux migrate -f . --yes
          if [[ $(git diff --stat) != '' ]]; then
            git --no-pager diff
            echo 'deprecated API versions found, run flux migrate and commit changes'
            exit 1
          fi
